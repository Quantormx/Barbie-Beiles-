name: Capture TGM Mobile Frames

on:
  push:
    branches:
      - capture-tgm-full-page
    paths:
      - 'scripts/capture-tgm-frames.mjs'
      - '.github/workflows/capture-tgm-frames.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d8d29245d368d3a0b8a1ee49718
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture mobile frames
        run: node scripts/capture-tgm-frames.mjs

      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: tgm-mobile-frames
          path: artifacts/tgm-mobile-frames
          if-no-files-found: error
          retention-days: 3
