<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Materiales de The Guide Method</title>
  <desc id="desc">Composición editorial rosa con workbooks, tablet, teléfono, audio, coaching y comunidad.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset=".45" stop-color="#f6c7d9"/>
      <stop offset="1" stop-color="#d66a94"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4e0f28"/>
      <stop offset=".55" stop-color="#8b1945"/>
      <stop offset="1" stop-color="#d03972"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#ffe8f1" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff6aa6" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ff6aa6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#5d1533" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1400" height="980" rx="54" fill="url(#bg)"/>
  <circle cx="1160" cy="160" r="250" fill="url(#glow)"/>
  <circle cx="260" cy="820" r="300" fill="#fff" opacity=".22" filter="url(#soft)"/>
  <path d="M0 790C250 680 410 850 650 760s390-155 750-20v240H0Z" fill="#fff" opacity=".33"/>

  <g opacity=".8" fill="none" stroke="#fff" stroke-width="2">
    <path d="M108 154C240 50 420 42 550 150"/>
    <path d="M1010 780c100 80 220 90 330 5"/>
  </g>

  <!-- Workbooks -->
  <g transform="translate(80 276) rotate(-5 230 250)" filter="url(#shadow)">
    <rect x="8" y="150" width="410" height="510" rx="22" fill="#8f1c49"/>
    <rect x="0" y="126" width="410" height="510" rx="22" fill="#f4bfd2"/>
    <rect x="20" y="148" width="370" height="466" rx="16" fill="url(#glass)"/>
    <text x="48" y="205" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#a61e55">THE GUIDE METHOD</text>
    <text x="48" y="300" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" fill="#111">WORK</text>
    <text x="48" y="368" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" fill="#111">BOOK</text>
    <text x="48" y="430" font-family="Georgia, serif" font-size="34" fill="#b3235c">Manifestación</text>
    <text x="48" y="470" font-family="Georgia, serif" font-size="34" fill="#b3235c">Nivel Experta</text>
    <path d="M48 536h285" stroke="#cf356f" stroke-width="4"/>
    <text x="48" y="580" font-family="Arial, sans-serif" font-size="22" letter-spacing="3" fill="#4e1830">01 · RECONOCE</text>
    <g fill="#8e1744">
      <circle cx="18" cy="188" r="7"/><circle cx="18" cy="236" r="7"/><circle cx="18" cy="284" r="7"/><circle cx="18" cy="332" r="7"/><circle cx="18" cy="380" r="7"/><circle cx="18" cy="428" r="7"/><circle cx="18" cy="476" r="7"/><circle cx="18" cy="524" r="7"/><circle cx="18" cy="572" r="7"/>
    </g>
  </g>

  <!-- Tablet -->
  <g transform="translate(455 146)" filter="url(#shadow)">
    <rect x="0" y="0" width="555" height="680" rx="46" fill="#151014"/>
    <rect x="18" y="18" width="519" height="644" rx="34" fill="#fff9fb"/>
    <circle cx="278" cy="12" r="5" fill="#4a4045"/>
    <rect x="45" y="54" width="465" height="150" rx="28" fill="url(#wine)"/>
    <text x="72" y="102" font-family="Georgia, serif" font-size="25" fill="#ffd3e3" letter-spacing="3">THE GUIDE METHOD</text>
    <text x="72" y="158" font-family="Arial Black, Arial, sans-serif" font-size="45" font-weight="900" fill="#fff">7 MÓDULOS</text>
    <g transform="translate(48 238)">
      <g font-family="Arial, sans-serif" font-size="22" fill="#181216">
        <rect x="0" y="0" width="458" height="62" rx="18" fill="#fde7ef"/><circle cx="31" cy="31" r="18" fill="#cf356f"/><text x="25" y="38" fill="#fff" font-size="16" font-weight="700">1</text><text x="66" y="39">Reconoce</text>
        <rect x="0" y="76" width="458" height="62" rx="18" fill="#fff" stroke="#f2cedc"/><circle cx="31" cy="107" r="18" fill="#e89ab8"/><text x="25" y="114" fill="#fff" font-size="16" font-weight="700">2</text><text x="66" y="115">Reprograma</text>
        <rect x="0" y="152" width="458" height="62" rx="18" fill="#fff" stroke="#f2cedc"/><circle cx="31" cy="183" r="18" fill="#e89ab8"/><text x="25" y="190" fill="#fff" font-size="16" font-weight="700">3</text><text x="66" y="191">Expande</text>
        <rect x="0" y="228" width="458" height="62" rx="18" fill="#fff" stroke="#f2cedc"/><circle cx="31" cy="259" r="18" fill="#e89ab8"/><text x="25" y="266" fill="#fff" font-size="16" font-weight="700">4</text><text x="66" y="267">Encarna</text>
        <rect x="0" y="304" width="458" height="62" rx="18" fill="#fff" stroke="#f2cedc"/><circle cx="31" cy="335" r="18" fill="#e89ab8"/><text x="25" y="342" fill="#fff" font-size="16" font-weight="700">5</text><text x="66" y="343">Actúa</text>
      </g>
    </g>
  </g>

  <!-- Phone -->
  <g transform="translate(965 345) rotate(4 150 260)" filter="url(#shadow)">
    <rect width="290" height="550" rx="48" fill="#131014"/>
    <rect x="13" y="13" width="264" height="524" rx="38" fill="#fff8fb"/>
    <rect x="96" y="25" width="98" height="22" rx="11" fill="#131014"/>
    <circle cx="145" cy="205" r="80" fill="#f4c3d5"/>
    <circle cx="145" cy="205" r="56" fill="url(#wine)"/>
    <path d="M131 176l50 29-50 29Z" fill="#fff"/>
    <text x="38" y="324" font-family="Georgia, serif" font-size="30" fill="#9d1d50">Meditación</text>
    <text x="38" y="360" font-family="Georgia, serif" font-size="30" fill="#9d1d50">guiada</text>
    <rect x="38" y="405" width="214" height="6" rx="3" fill="#edbfd0"/>
    <rect x="38" y="405" width="92" height="6" rx="3" fill="#c72c65"/>
    <circle cx="130" cy="408" r="12" fill="#c72c65"/>
    <text x="38" y="470" font-family="Arial, sans-serif" font-size="18" letter-spacing="2" fill="#5a243b">AUDIO SUBLIMINAL</text>
  </g>

  <!-- Floating cards -->
  <g transform="translate(990 95) rotate(6 150 90)" filter="url(#shadow)">
    <rect width="315" height="170" rx="28" fill="rgba(255,255,255,.9)" stroke="#fff"/>
    <circle cx="62" cy="70" r="32" fill="#cf356f"/>
    <circle cx="94" cy="70" r="28" fill="#ed9bbb"/>
    <circle cx="78" cy="112" r="36" fill="#7e173f"/>
    <text x="135" y="65" font-family="Arial Black, Arial, sans-serif" font-size="25" fill="#151014">TGM</text>
    <text x="135" y="96" font-family="Arial Black, Arial, sans-serif" font-size="25" fill="#151014">COLLECTIVE</text>
    <text x="135" y="130" font-family="Arial, sans-serif" font-size="17" fill="#6f5360">Comunidad privada</text>
  </g>

  <g transform="translate(318 92) rotate(-8 120 70)" filter="url(#shadow)">
    <rect width="250" height="142" rx="26" fill="#fff" opacity=".9"/>
    <path d="M45 78c25-42 62-42 87 0s62 42 87 0" fill="none" stroke="#d13670" stroke-width="8" stroke-linecap="round"/>
    <text x="38" y="122" font-family="Arial, sans-serif" font-size="17" letter-spacing="2" fill="#6e1738">BREATHWORK</text>
  </g>

  <!-- Ground titles -->
  <text x="92" y="914" font-family="Arial Black, Arial, sans-serif" font-size="54" font-weight="900" fill="#171216">TODO LO QUE RECIBIRÁS</text>
  <text x="94" y="954" font-family="Georgia, serif" font-size="24" fill="#8e1744">Aprende · practica · integra · sostén</text>
</svg>